<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#fbf7ee;font-family:system-ui,sans-serif}
.wrap{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-end;padding:36px}
.red{background:#a72a23;border-radius:24px;padding:14px;box-shadow:0 16px 30px rgba(80,20,15,.22)}
.dark{background:#0f2527;border-radius:24px;padding:14px;box-shadow:0 16px 30px rgba(5,20,20,.25)}
.big{width:512px;height:512px;display:block}
.small{width:128px;height:128px;display:block}
.tiny{width:64px;height:64px;display:block}
.row{display:flex;flex-direction:column;align-items:center;gap:8px;color:#7f6a54;font-size:12px}
</style></head><body>
<div class="wrap">
  <div class="row"><img class="big" src="dragon-app-icon.svg"><span>红底白龙印章 · 应用图标</span></div>
  <div class="row"><div class="dark"><img class="big" src="dragon-mark-white-final.svg"></div><span>纯白龙首 · 透明底</span></div>
</div>
<div class="wrap">
  <div class="row"><img class="small" src="dragon-app-icon.svg"><span>128</span></div>
  <div class="row"><img class="tiny" src="dragon-app-icon.svg"><span>64</span></div>
  <div class="row"><div class="dark"><img class="small" src="dragon-mark-white-final.svg"></div><span>128 · 深底</span></div>
  <div class="row"><div class="dark"><img class="tiny" src="dragon-mark-white-final.svg"></div><span>64 · 深底</span></div>
</div>
</body></html>
