<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#fbf7ee;font-family:system-ui,sans-serif}
.wrap{display:flex;flex-wrap:wrap;gap:30px;align-items:flex-end;padding:36px}
.big{width:512px;height:512px;filter:drop-shadow(0 14px 24px rgba(70,50,30,.2))}
.small{width:128px;height:128px}
.tiny{width:64px;height:64px}
.row{display:flex;flex-direction:column;align-items:center;gap:8px;color:#7f6a54;font-size:12px}
.dark{padding:24px;background:#102a2c;border-radius:18px;display:flex;gap:24px;align-items:center}
</style></head><body>
<div class="wrap">
  <div class="row"><img class="big" src="dragon-icon-v3.svg"><span>512 应用图标</span></div>
  <div class="row"><img class="small" src="dragon-icon-v3.svg"><span>128</span></div>
  <div class="row"><img class="tiny" src="dragon-icon-v3.svg"><span>64</span></div>
</div>
<div class="dark"><img class="tiny" src="dragon-icon-v3.svg"><img class="small" src="dragon-icon-v3.svg"></div>
</body></html>
