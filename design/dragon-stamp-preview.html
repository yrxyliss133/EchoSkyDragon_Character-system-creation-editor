<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#f3eee4;font-family:system-ui,sans-serif}
.wrap{padding:28px;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end}
.card{background:#0b1718;border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:14px;align-items:center;box-shadow:0 10px 24px rgba(20,15,10,.16)}
.card.teal{background:#102a2c}
.card.black{background:#070a0b}
.icon{display:block;filter:drop-shadow(0 4px 8px rgba(0,0,0,.18))}
.big{width:512px;height:512px}
.mid{width:128px;height:128px}
.small{width:64px;height:64px}
.label{color:#b9a88f;font-size:12px;letter-spacing:.08em}
.row{display:flex;gap:18px;align-items:center}
</style></head><body>
<div class="wrap">
  <div class="card teal">
    <img class="icon big" src="dragon-stamp-white.svg" alt="">
    <span class="label">白色龙头印章 · 512</span>
  </div>
  <div class="card black">
    <div class="row">
      <img class="icon mid" src="dragon-stamp-white.svg" alt="">
      <img class="icon small" src="dragon-stamp-white.svg" alt="">
    </div>
    <span class="label">128 / 64</span>
  </div>
  <div class="card teal">
    <img class="icon small" src="dragon-stamp-white.svg" alt="">
    <span class="label">64 小尺寸</span>
  </div>
</div>
</body></html>
